[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mj-studio"
version = "0.2.0"
description = "Versioned original micro-drama production workbench"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.2", "uvicorn==0.48.0", "pydantic==2.13.4",
  "SQLAlchemy==2.0.50", "alembic==1.18.4", "psycopg[binary]==3.2.10",
  "httpx==0.28.1", "python-multipart==0.0.29", "Pillow==12.3.0"
]
[project.optional-dependencies]
test = ["pytest==9.0.2", "pytest-cov==7.0.0"]
[project.scripts]
mj = "mj.cli:main"
[tool.setuptools.packages.find]
include = ["mj*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["media: executes FFmpeg", "postgres: requires PostgreSQL"]
