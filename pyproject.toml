[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mj-studio"
version = "0.4.0"
description = "Auditable original micro-drama production workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2", "starlette==0.50.0", "pydantic==2.13.4",
  "SQLAlchemy==2.0.50", "alembic==1.18.4", "httpx==0.28.1",
  "uvicorn==0.48.0", "python-multipart==0.0.29", "Pillow==12.3.0"
]
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest==9.0.2", "playwright>=1.50,<2"]
[project.scripts]
mj = "mj.cli:main"
[tool.setuptools.packages.find]
include = ["mj*"]
[tool.setuptools.package-data]
mj = ["web/*", "workflows/comfyui/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
